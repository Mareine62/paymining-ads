<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Paymining Ads</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #17133b, #5b21b6, #2563eb);
      color: #202033;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px #0003;
    }

    h1 { text-align: center; color: #4f46e5; }
    p { text-align: center; color: #666; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #e9e7ff;
      color: #4338ca;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
      font-size: 14px;
      text-align: center;
    }

    .back {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #4f46e5;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Paymining Ads</h1>
    <p>Crée ton compte ou connecte-toi.</p>

    <form id="authForm">
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
        placeholder="exemple@email.com"
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        minlength="6"
        required
        placeholder="6 caractères minimum"
      >

      <button type="submit" id="loginBtn">Se connecter</button>
      <button type="button" class="secondary" id="registerBtn">
        Créer un compte
      </button>
    </form>

    <div id="message" role="status"></div>
    <a class="back" href="index.html">Retour à l'accueil</a>
  </main>

  <script type="module">
    import {
      inscrireUtilisateur,
      connecterUtilisateur
    } from "./auth.js";

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");

    function afficherErreur(error) {
      const erreurs = {
        "auth/email-already-in-use":
          "Cette adresse e-mail possède déjà un compte.",
        "auth/invalid-email":
          "L'adresse e-mail est invalide.",
        "auth/weak-password":
          "Choisis un mot de passe plus solide.",
        "auth/invalid-credential":
          "E-mail ou mot de passe incorrect.",
        "auth/network-request-failed":
          "Vérifie ta connexion Internet."
      };

      message.textContent =
        erreurs[error.code] ||
        "Une erreur est survenue. Code : " + error.code;
    }

    async function executer(action) {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      message.textContent = "Patiente, traitement en cours...";
      loginBtn.disabled = true;
      registerBtn.disabled = true;

      try {
        await action(email, password);
        message.textContent = "Connexion réussie !";
        window.location.href = "index.html";
      } catch (error) {
        afficherErreur(error);
      } finally {
        loginBtn.disabled = false;
        registerBtn.disabled = false;
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      executer(connecterUtilisateur);
    });

    registerBtn.addEventListener("click", function() {
      if (!form.reportValidity()) return;
      executer(inscrireUtilisateur);
    });
  </script>
</body>
</html>
